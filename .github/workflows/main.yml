name: Gerar APK BotTradingPro
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    container: python:3.10
    steps:
      - uses: actions/checkout@v4

      - name: 📦 INSTALA TUDO NO CONTAINER — JÁ VEM COM PYTHON
        run: |
          apt-get update -qq
          apt-get install -y -qq git wget zip unzip build-essential openjdk-17-jdk android-sdk-build-tools aidl ant
          python -m pip install --upgrade pip setuptools wheel cython==0.29.37
          python -m pip install buildozer==1.5.0

      - name: 🚀 COMPILA DIRETO — NÃO PRECISA BAIXAR NADA EXTRA
        run: |
          buildozer android debug --no-updates --log-level 2
        timeout-minutes: 240

      - name: 📦 PEGA O APK
        run: |
          mkdir -p bin
          APK=$(find . -name "*.apk" -type f | head -n 1)
          [ -n "$APK" ] && cp "$APK" bin/BotTradingPro.apk

      - name: 📥 BAIXA
        uses: actions/upload-artifact@v4
        with:
          name: BotTradingPro-APK-FINAL
          path: bin/*.apk

