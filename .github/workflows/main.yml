name: Gerar APK BotTradingPro
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar Java e ferramentas do sistema
        run: |
          sudo apt update -y
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev
          pip3 install --upgrade pip setuptools wheel
          pip3 install --no-cache-dir Cython==0.29.36 buildozer==1.5.0 virtualenv

      - name: Compilar APK (leva 12~18 min)
        run: |
          buildozer android debug
        timeout-minutes: 50

      - name: APK Pronto para baixar
        uses: actions/upload-artifact@v4
        with:
          name: BotTradingPro-APK-PRONTO
          path: bin/*.apk
