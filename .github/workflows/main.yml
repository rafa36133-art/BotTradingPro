name: Gerar APK BotTradingPro
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /home/runner/Android/Sdk
      ANDROID_NDK_HOME: /home/runner/Android/Sdk/ndk/25.2.9519653
      PATH: /usr/bin:/bin:/home/runner/.local/bin:/home/runner/Android/Sdk/cmdline-tools/latest/bin:/home/runner/Android/Sdk/platform-tools:$PATH

    steps:
      - uses: actions/checkout@v4

      - name: Instalar tudo do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tar zip unzip git wget build-essential autoconf libtool pkg-config python3-pip openjdk-17-jdk

      - name: Instalar Python e ferramentas
        run: |
          python3 -m pip install --upgrade pip setuptools wheel cython==0.29.37
          python3 -m pip install --user python-for-android==2023.9.16
          # ✅ FORMA CORRETA DE VERIFICAR
          python3 -c "import p4a; print('✅ p4a INSTALADO COM SUCESSO!')"

      - name: Preparar SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmd.zip
          unzip -q cmd.zip && mv cmdline-tools latest
          
          yes | sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" "build-tools;33.0.3" "platforms;android-33" "ndk;25.2.9519653" > /dev/null 2>&1
          
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license

      - name: 🚀 COMPILAR — FORMA OFICIAL E CORRETA!
        run: |
          python3 -m p4a apk \
            --name "BotTradingPro" \
            --package.name "bottradingpro" \
            --package.domain "com.trading.bot" \
            --version "1.0" \
            --ndk $ANDROID_NDK_HOME \
            --sdk $ANDROID_HOME \
            --android-api 33 \
            --arch arm64-v8a \
            --permission INTERNET \
            --permission ACCESS_NETWORK_STATE \
            --permission WAKE_LOCK \
            --permission FOREGROUND_SERVICE \
            --permission POST_NOTIFICATIONS \
            --mainclass "org.kivy.android.PythonActivity" \
            --requirements "python3,kivy==2.3.0,pillow==10.3.0,kivymd==1.2.0,plyer,python-binance==1.0.19,python-dotenv==1.0.1,requests" \
            --add-assets "main.py:main.py" \
            --add-assets "*.py:." \
            --add-assets "*.kv:." \
            --add-assets "*.png:." \
            --add-assets "*.json:." \
            --icon icon.png \
            --debug \
            --out bin/BotTradingPro.apk
        timeout-minutes: 120

      - name: Verificar APK
        run: |
          ls -la bin/
          find . -name "*.apk" -type f

      - name: Baixar APK
        uses: actions/upload-artifact@v4
        with:
          name: BotTradingPro-APK-FINAL
          path: bin/*.apk

