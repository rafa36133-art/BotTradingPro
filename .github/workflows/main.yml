name: Gerar APK BotTradingPro
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /home/runner/Android/Sdk

    steps:
      - uses: actions/checkout@v4

      - name: 🧹 APAGA TUDO O QUE O BUILDOZER CRIOU ERRADO
        run: rm -rf ~/.buildozer .buildozer

      - name: Instalar sistema + AIDL oficial
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip build-essential python3-pip openjdk-17-jdk wget android-sdk-build-tools aidl
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install sh==1.14.3 Cython==0.29.37 buildozer==1.5.0

      - name: 🛠️ Preparar SDK e licenças
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmd.zip
          unzip -q cmd.zip && mv cmdline-tools latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          
          yes | sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" "build-tools;33.0.3" "platforms;android-33" "ndk;25.2.9519653" > /dev/null 2>&1
          
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          
          # ✅ CRIA O AIDL EXATAMENTE ONDE ELE PROCURA
          mkdir -p /home/runner/.buildozer/platform/android-sdk/build-tools/33.0.3/
          ln -sf /usr/bin/aidl /home/runner/.buildozer/platform/android-sdk/build-tools/33.0.3/aidl
          ln -sf /usr/bin/aidl $ANDROID_HOME/build-tools/33.0.3/aidl
          echo "✅ AIDL DISPONÍVEL EM TODOS OS CAMINHOS!"

      - name: 🚀 COMPILAR — AGORA USA O NOSSO SDK!
        run: |
          buildozer android debug --no-updates
        timeout-minutes: 120

      - name: 🔍 PEGAR APK
        run: |
          mkdir -p bin
          APK=$(find /home/runner -name "*.apk" -type f | head -n 1)
          [ -n "$APK" ] && cp "$APK" bin/BotTradingPro.apk && ls -la bin/

      - name: ✅ BAIXAR APK
        uses: actions/upload-artifact@v4
        with:
          name: BotTradingPro-APK-FINAL
          path: bin/*.apk
