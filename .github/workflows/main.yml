name: Gerar APK BotTradingPro
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /home/runner/Android/Sdk
      ANDROID_NDK_HOME: /home/runner/Android/Sdk/ndk/25.2.9519653
      PATH: /usr/bin:/bin:/home/runner/.local/bin:/home/runner/Android/Sdk/cmdline-tools/latest/bin:/home/runner/Android/Sdk/platform-tools:$PATH

    steps:
      - uses: actions/checkout@v4

      - name: Limpar tudo
        run: rm -rf ~/.buildozer .buildozer bin buildozer.log __pycache__

      - name: Instalar sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tar zip unzip git wget build-essential python3-pip openjdk-17-jdk android-sdk-build-tools aidl

      - name: Instalar Buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel cython==0.29.37
          python3 -m pip install --user sh==1.14.3 buildozer==1.5.0
          # Confirma instalação
          python3 -c "import buildozer; print('✅ BUILDOZER INSTALADO!')"

      - name: Preparar SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmd.zip
          unzip -q cmd.zip && mv cmdline-tools latest
          
          yes | sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" "build-tools;33.0.3" "platforms;android-33" "ndk;25.2.9519653" > /dev/null 2>&1
          
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          
          mkdir -p /home/runner/Android/Sdk/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager /home/runner/Android/Sdk/tools/bin/sdkmanager
          mkdir -p /home/runner/.buildozer/platform/android-sdk
          cp -r $ANDROID_HOME/* /home/runner/.buildozer/platform/android-sdk/

      - name: 🚀 COMPILAR — SEMPRE FUNCIONA!
        run: |
          python3 -m buildozer android debug --no-updates
        timeout-minutes: 120

      - name: Pegar APK
        run: |
          mkdir -p bin
          APK=$(find /home/runner -name "*.apk" -type f | head -n 1)
          [ -n "$APK" ] && cp "$APK" bin/BotTradingPro.apk && ls -la bin/

      - name: Baixar APK
        uses: actions/upload-artifact@v4
        with:
          name: BotTradingPro-APK-FINAL
          path: bin/*.apk

