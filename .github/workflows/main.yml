name: Gerar APK BotTradingPro
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /home/runner/Android/Sdk
      ANDROID_SDK_ROOT: /home/runner/Android/Sdk
      ANDROID_NDK_HOME: /home/runner/Android/Sdk/ndk/25.2.9519653

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar libs do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libsqlite3-dev wget
          java -version

      - name: 🛠️ Instalar Android SDK + NDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          mkdir -p $ANDROID_HOME/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" "build-tools;33.0.3" "platforms;android-33" "ndk;25.2.9519653" > /dev/null 2>&1
          echo "✅ SDK PRONTO!"

      - name: 📦 Instalar ferramentas de compilação
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --no-cache-dir \
            sh==1.14.3 \
            Cython==0.29.37 \
            python-for-android==2023.9.16
          p4a --version

      - name: 🚀 COMPILAR APK DIRETO COM P4A (SEM BUILDOZER!)
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          export ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME
          
          p4a apk \
            --name "BotTradingPro" \
            --package.name "bottradingpro" \
            --package.domain "com.trading.bot" \
            --version "1.0" \
            --ndk $ANDROID_NDK_HOME \
            --sdk $ANDROID_HOME \
            --android-api 33 \
            --ndk-api 33 \
            --arch arm64-v8a \
            --permission INTERNET \
            --permission ACCESS_NETWORK_STATE \
            --permission WAKE_LOCK \
            --permission FOREGROUND_SERVICE \
            --permission POST_NOTIFICATIONS \
            --permission RECEIVE_BOOT_COMPLETED \
            --requirements "python3,kivy==2.3.0,pillow==10.3.0,kivymd==1.2.0,plyer,python-binance==1.0.19,python-dotenv==1.0.1,requests" \
            --mainclass "org.kivy.android.PythonActivity" \
            --add-assets "main.py:main.py" \
            --add-assets "bot_*.py:." \
            --add-assets "*.kv:." \
            --add-assets "*.json:." \
            --add-assets "*.env:." \
            --add-assets "*.png:." \
            --add-assets "*.jpg:." \
            --icon icon.png \
            --presplash-color "#0B0E11" \
            --debug \
            --dist-name BotTradingPro \
            --out bin/BotTradingPro.apk
        timeout-minutes: 90

      - name: 📂 VERIFICAR APK GERADO
        run: |
          ls -la bin/
          find . -name "*.apk" -type f

      - name: ✅ APK PRONTO PARA BAIXAR
        uses: actions/upload-artifact@v4
        with:
          name: BotTradingPro-APK-PRONTO
          path: bin/*.apk
          compression-level: 9
