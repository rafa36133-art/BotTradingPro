name: Gerar APK BotTradingPro
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Pegar codigo
        uses: actions/checkout@v4

      - name: Instalar programas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git wget zip unzip build-essential default-jdk-headless ant

      - name: Instalar Python e Buildozer SEM BUG
        run: |
          python3 -m pip install --upgrade pip setuptools wheel cython==0.29.37 requests==2.31.0
          # Usamos versao 1.4.2 que NAO TEM o erro de "read of closed file"
          python3 -m pip install --user buildozer==1.4.2

      - name: Compilar APK
        run: |
          python3 -m buildozer android debug --no-updates --no-distribute --log-level 2
        timeout-minutes: 300

      - name: Preparar APK
        run: |
          mkdir -p bin
          APK=$(find . -name "*.apk" -type f | head -n 1)
          if [ -n "$APK" ]; then
            cp "$APK" bin/BotTradingPro.apk
          fi

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: BotTradingPro-APK-FINAL
          path: bin/*.apk
