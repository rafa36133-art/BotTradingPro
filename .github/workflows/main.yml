name: Gerar APK BotTradingPro
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /home/runner/Android/Sdk
      PATH: /usr/bin:/bin:/home/runner/.local/bin:$PATH

    steps:
      - uses: actions/checkout@v4

      - name: Instalar TUDO — INCLUSO AIDL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tar zip unzip git wget build-essential python3-pip openjdk-17-jdk android-sdk-build-tools aidl
          python3 -m pip install --upgrade pip setuptools wheel cython==0.29.37
          python3 -m pip install --user buildozer==1.5.0

      - name: Preparar SDK — VERSÕES EXATAS E RECONHECIDAS
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmd.zip
          unzip -q cmd.zip && mv cmdline-tools latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          
          # Licenças
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          
          # ✅ USA NOME COMPLETO DO NDK — NÃO TEM ERRO!
          sdkmanager --sdk_root=$ANDROID_HOME --install \
            "platform-tools" "build-tools;33.0.2" "platforms;android-33" "ndk;25.2.9519653"
          
          # Copia SDK e AIDL para todos os caminhos
          BZ_SDK=/home/runner/.buildozer/platform/android-sdk
          mkdir -p $BZ_SDK
          cp -r $ANDROID_HOME/* $BZ_SDK/
          
          AIDL_BIN=$(which aidl)
          for pasta in \
            $BZ_SDK/build-tools/33.0.2 \
            $BZ_SDK/build-tools/33.0.3 \
            $ANDROID_HOME/build-tools/33.0.2 \
            /usr/local/bin
          do
            mkdir -p $pasta
            cp $AIDL_BIN $pasta/aidl
            chmod +x $pasta/aidl
          done
          
          echo "✅ TODAS VERSÕES E CAMINHOS CORRETOS!"

      - name: 🚀 COMPILAR
        run: |
          python3 -m buildozer android debug --no-updates --log-level 2
        timeout-minutes: 120

      - name: Pegar APK
        run: |
          mkdir -p bin
          APK=$(find /home/runner -name "*.apk" -type f | head -n 1)
          [ -n "$APK" ] && cp "$APK" bin/BotTradingPro.apk && echo "✅ APK GERADO!"

      - name: Baixar APK
        uses: actions/upload-artifact@v4
        with:
          name: BotTradingPro-APK-FINAL
          path: bin/*.apk

