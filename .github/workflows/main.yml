name: Gerar APK BotTradingPro
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /home/runner/Android/Sdk
      ANDROID_SDK_ROOT: /home/runner/Android/Sdk
      ANDROID_NDK_HOME: /home/runner/Android/Sdk/ndk/25.2.9519653

    steps:
      - uses: actions/checkout@v4

      - name: Instalar sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev wget

      - name: Instalar Python e Buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install sh==1.14.3 Cython==0.29.37 buildozer==1.5.0

      - name: 🛠️ Instalar SDK EXATO + ACEITAR LICENÇAS
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmd.zip
          unzip -q cmd.zip && mv cmdline-tools latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          mkdir -p $ANDROID_HOME/tools/bin && ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
          
          # INSTALA SOMENTE O QUE PRECISAMOS E JÁ ACEITO
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" "build-tools;33.0.3" "platforms;android-33" "ndk;25.2.9519653" > /dev/null 2>&1
          
          # FORÇA LICENÇAS SALVAS
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b940964dbf10b9bf471b6d16e09f7367441" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "✅ SDK 33.0.3 PRONTO!"

      - name: 🧹 Limpar cache
        run: rm -rf ~/.buildozer .buildozer bin

      - name: 🚀 COMPILAR (NÃO MUDA VERSÃO!)
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          export ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME
          buildozer android debug
        timeout-minutes: 90

      - name: 🔍 PEGAR APK
        run: |
          mkdir -p bin
          APK=$(find /home/runner -name "*.apk" -type f | head -n 1)
          [ -n "$APK" ] && cp "$APK" bin/BotTradingPro.apk && ls -la bin/

      - name: ✅ BAIXAR APK
        uses: actions/upload-artifact@v4
        with:
          name: BotTradingPro-APK-PRONTO
          path: bin/*.apk

