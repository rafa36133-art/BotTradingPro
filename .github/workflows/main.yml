name: Gerar APK BotTradingPro
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /home/runner/Android/Sdk
      PATH: /usr/bin:/bin:/home/runner/.local/bin:/home/runner/Android/Sdk/cmdline-tools/latest/bin:/home/runner/Android/Sdk/platform-tools:$PATH

    steps:
      - name: GARANTE COMANDOS BÁSICOS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tar zip unzip git wget build-essential python3-pip openjdk-17-jdk android-sdk-build-tools aidl

      - uses: actions/checkout@v4

      - name: 📂 VERIFICA SEUS ARQUIVOS EXISTEM
        run: |
          echo "📂 ARQUIVOS NA RAIZ DO PROJETO:"
          ls -la *.py *.kv *.png *.env 2>/dev/null || echo "⚠️ Alguns arquivos não encontrados"
          test -f main.py && echo "✅ main.py ENCONTRADO" || echo "❌ ERRO: main.py NÃO EXISTE!"
          test -f buildozer.spec && echo "✅ buildozer.spec ENCONTRADO" || echo "❌ ERRO: buildozer.spec NÃO EXISTE!"

      - name: INSTALA BUILDOZER
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --user sh==1.14.3 Cython==0.29.37 buildozer==1.5.0
          python3 -m buildozer --version

      - name: PREPARAR SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmd.zip
          unzip -q cmd.zip && mv cmdline-tools latest
          
          yes | sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" "build-tools;33.0.3" "platforms;android-33" "ndk;25.2.9519653" > /dev/null 2>&1
          
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          
          mkdir -p /home/runner/Android/Sdk/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager /home/runner/Android/Sdk/tools/bin/sdkmanager
          mkdir -p /home/runner/.buildozer/platform/android-sdk
          cp -r $ANDROID_HOME/* /home/runner/.buildozer/platform/android-sdk/

      - name: 🚀 COMPILAR COM LOG COMPLETO (NÃO ESCONDE NADA!)
        run: |
          python3 -m buildozer android debug --no-updates --log-level 2
        timeout-minutes: 120

      - name: 🔍 PEGAR APK
        run: |
          mkdir -p bin
          APK=$(find /home/runner -name "*.apk" -type f | head -n 1)
          if [ -n "$APK" ]; then
            cp "$APK" bin/BotTradingPro.apk
            ls -la bin/
          else
            echo "❌ APK NÃO GERADO — MOSTRANDO ÚLTIMAS 200 LINHAS DO LOG:"
            tail -n 200 buildozer.log
            exit 1
          fi

      - name: ✅ BAIXAR APK
        uses: actions/upload-artifact@v4
        with:
          name: BotTradingPro-APK-FINAL
          path: bin/*.apk

