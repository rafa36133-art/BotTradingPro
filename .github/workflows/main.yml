name: Gerar APK BotTradingPro
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 📦 INSTALA TUDO COM NOMES CORRETOS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git wget zip unzip build-essential default-jdk android-sdk-build-tools aidl ant
          python3 -m pip install --upgrade pip setuptools wheel cython==0.29.37
          python3 -m pip install --user buildozer==1.5.0

      - name: 🚀 COMPILA
        run: |
          python3 -m buildozer android debug --no-updates --log-level 2
        timeout-minutes: 240

      - name: 📦 PEGA O APK
        run: |
          mkdir -p bin
          APK=$(find . -name "*.apk" -type f | head -n 1)
          [ -n "$APK" ] && cp "$APK" bin/BotTradingPro.apk

      - name: 📥 BAIXA
        uses: actions/upload-artifact@v4
        with:
          name: BotTradingPro-APK-FINAL
          path: bin/*.apk

