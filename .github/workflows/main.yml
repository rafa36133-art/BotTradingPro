name: Gerar APK BotTradingPro
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 📦 INSTALA TUDO + VERSÃO MAIS ESTÁVEL DO BUILDOZER
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git wget zip unzip build-essential default-jdk-headless android-sdk-build-tools aidl ant
          python3 -m pip install --upgrade pip setuptools wheel cython==0.29.37 requests==2.31.0
          # ✅ USA VERSÃO 1.4.2 — A MAIS ESTÁVEL DE TODAS, SEM BUG NO DOWNLOAD
          python3 -m pip install --user buildozer==1.4.2

      - name: 🚀 COMPILA — FORÇA NÃO BAIXAR NADA
        run: |
          python3 -m buildozer android debug --no-updates --no-distribute --log-level 2
        timeout-minutes: 300

      - name: 📦 PEGA O APK GERADO
        run: |
          mkdir -p bin
          APK=$(find . -name "*.apk" -type f | head -n 1)
          if [ -n "$APK" ]; then
            cp "$APK" bin/BotTradingPro.apk
            echo "✅ APK GERADO COM SUCESSO!"
          else
            echo "❌ APK NÃO ENCONTRADO"
            exit 1
          fi

      - name: 📥 BAIXAR O APK
        uses: actions/upload-artifact@v4
        with:
          name: BotTradingPro-APK-FINAL
          path: bin/*.apk

