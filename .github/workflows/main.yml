name: Gerar APK BotTradingPro
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 🚀 GERAR APK COM AÇÃO PRONTA — NÃO PRECISA CONFIGURAR NADA!
        uses: tikkana/buildozer-action@v1
        with:
          python-version: '3.10'
          buildozer-arguments: 'android debug'

      - name: Pegar APK
        run: |
          mkdir -p bin
          APK=$(find . -name "*.apk" -type f | head -n 1)
          [ -n "$APK" ] && cp "$APK" bin/BotTradingPro.apk

      - name: Baixar APK
        uses: actions/upload-artifact@v4
        with:
          name: BotTradingPro-APK-FINAL
          path: bin/*.apk
