name: Gerar APK BotTradingPro
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /home/runner/Android/Sdk
      ANDROID_SDK_ROOT: /home/runner/Android/Sdk
      ANDROID_NDK_HOME: /home/runner/Android/Sdk/ndk/25.2.9519653
      BUILDOZER_ANDROID_SDK_DIR: /home/runner/Android/Sdk
      BUILDOZER_ANDROID_NDK_DIR: /home/runner/Android/Sdk/ndk/25.2.9519653

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar libs do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libsqlite3-dev wget
          java -version

      - name: 🛠️ Instalar Android SDK + NDK + Build-Tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          mkdir -p $ANDROID_HOME/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" "build-tools;33.0.3" "platforms;android-33" "ndk;25.2.9519653" > /dev/null 2>&1
          echo "✅ SDK PRONTO!"

      - name: ✅ Aceitar TODAS licenças
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b940964dbf10b9bf471b6d16e09f7367441" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "✅ Licenças aceitas!"

      - name: 📦 Instalar Buildozer sem conflitos
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --no-cache-dir sh==1.14.3
          python3 -m pip install --no-cache-dir \
            Cython==0.29.37 \
            buildozer==1.5.0 \
            virtualenv==20.26.2
          buildozer --version

      - name: 🧹 Limpar cache TOTAL
        run: |
          rm -rf ~/.buildozer .buildozer bin buildozer.log
          echo "✅ Cache limpo!"

      - name: 🚀 COMPILAR APK COM BUILDOZER (O QUE JÁ FUNCIONAVA!)
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          export ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME
          buildozer android debug 2>&1 | tee buildozer.log
        timeout-minutes: 90
        continue-on-error: true

      - name: 🔍 ENCONTRAR APK EM QUALQUER LUGAR
        run: |
          echo "🔍 Procurando APK..."
          find /home/runner -name "*.apk" -type f 2>/dev/null
          mkdir -p bin
          APK=$(find /home/runner -name "*.apk" -type f | head -n 1)
          if [ -n "$APK" ]; then
            echo "✅ APK ENCONTRADO: $APK"
            cp "$APK" bin/BotTradingPro.apk
            ls -la bin/
          else
            echo "❌ Sem APK — mostrando final do log:"
            tail -n 150 buildozer.log
            exit 1
          fi

      - name: 📎 SALVAR LOG
        uses: actions/upload-artifact@v4
        with:
          name: Log-Compilacao
          path: buildozer.log
          if-no-files-found: ignore

      - name: ✅ APK PRONTO
        uses: actions/upload-artifact@v4
        with:
          name: BotTradingPro-APK-PRONTO
          path: bin/*.apk
          compression-level: 9

