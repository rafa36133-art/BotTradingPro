name: Gerar APK BotTradingPro
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /home/runner/Android/Sdk
      ANDROID_SDK_ROOT: /home/runner/Android/Sdk
      ANDROID_NDK_HOME: /home/runner/Android/Sdk/ndk/25.2.9519653
      BUILDOZER_ANDROID_SDK_DIR: /home/runner/Android/Sdk
      BUILDOZER_ANDROID_NDK_DIR: /home/runner/Android/Sdk/ndk/25.2.9519653

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar libs do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libsqlite3-dev wget
          java -version
          python3 --version

      - name: 🛠️ Instalar Android SDK + NDK + Build-Tools 33.0.3
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          mkdir -p $ANDROID_HOME/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "build-tools;33.0.3" \
            "platforms;android-33" \
            "ndk;25.2.9519653" > /dev/null 2>&1
          echo "✅ SDK, NDK e atalho prontos!"

      - name: ✅ Aceitar TODAS licenças
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b940964dbf10b9bf471b6d16e09f7367441" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "✅ Licenças aceitas!"

      - name: 📦 Instalar Buildozer + versões sem conflito
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --no-cache-dir sh==1.14.3
          python3 -m pip install --no-cache-dir \
            Cython==0.29.37 \
            buildozer==1.5.0 \
            virtualenv==20.26.2 \
            python-for-android==2023.9.16
          buildozer --version

      - name: 🧹 Limpar cache velho
        run: |
          rm -rf ~/.buildozer .buildozer bin buildozer.log
          echo "✅ Cache limpo!"

      - name: 🚀 COMPILAR APK DE VERDADE (15~25 MIN - LOG LIMPO!)
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          export ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME
          # ✅ Compila com log mínimo, SALVA TUDO no arquivo buildozer.log
          buildozer android release 2>&1 | tee buildozer.log | grep -iE "error|fail|fatal|apk|built|success|bin/" || true
        timeout-minutes: 90
        continue-on-error: true

      - name: 🔍 MOSTRAR SÓ O FINAL DO LOG (VER ERRO REAL!)
        run: |
          echo "=========================================="
          echo "📋 ÚLTIMAS 300 LINHAS DO LOG COMPLETO:"
          echo "=========================================="
          tail -n 300 buildozer.log 2>/dev/null || echo "❌ Log não encontrado"
          echo ""
          echo "📂 CONTEÚDO DA PASTA BIN:"
          ls -la bin/ 2>/dev/null || echo "❌ Pasta bin vazia"

      - name: 📎 SALVAR LOG COMPLETO PARA BAIXAR
        uses: actions/upload-artifact@v4
        with:
          name: Log-Completo-Compilacao
          path: buildozer.log
          if-no-files-found: ignore

      - name: ✅ APK PRONTO PARA BAIXAR
        uses: actions/upload-artifact@v4
        with:
          name: BotTradingPro-APK-PRONTO
          path: bin/*.apk
          compression-level: 9
          if-no-files-found: ignore

