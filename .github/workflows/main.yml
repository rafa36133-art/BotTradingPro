name: Gerar APK BotTradingPro
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /home/runner/Android/Sdk

    steps:
      - uses: actions/checkout@v4

      - name: Instalar TUDO do sistema — INCLUSO AIDL!
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip build-essential autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libtinfo5 cmake libffi-dev libssl-dev \
            python3 python3-dev python3-pip python3-venv openjdk-17-jdk wget \
            android-sdk-build-tools android-sdk-platform-tools aidl
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install sh==1.14.3 Cython==0.29.37 buildozer==1.5.0

      - name: 🛠️ Preparar SDK e licenças
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmd.zip
          unzip -q cmd.zip && mv cmdline-tools latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          
          yes | sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" "build-tools;33.0.3" "platforms;android-33" "ndk;25.2.9519653" > /dev/null 2>&1
          
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          
          # COPIA SDK PARA O CAMINHO DO BUILDOZER
          mkdir -p /home/runner/.buildozer/platform/android-sdk
          cp -r $ANDROID_HOME/* /home/runner/.buildozer/platform/android-sdk/
          
          # CRIA LINK DO AIDL NO CAMINHO QUE ELE PROCURA
          ln -sf /usr/bin/aidl /home/runner/.buildozer/platform/android-sdk/build-tools/33.0.3/aidl
          echo "✅ AIDL E TODO SDK DISPONÍVEL!"

      - name: 🧹 Limpar cache total
        run: rm -rf ~/.buildozer .buildozer bin buildozer.log

      - name: 🚀 COMPILAR — AGORA NÃO TEM COMO FALHAR!
        run: |
          buildozer android debug --no-updates
        timeout-minutes: 120

      - name: 🔍 Pegar APK
        run: |
          mkdir -p bin
          APK=$(find /home/runner -name "*.apk" -type f | head -n 1)
          if [ -n "$APK" ]; then
            cp "$APK" bin/BotTradingPro.apk
            ls -la bin/
          else
            echo "❌ Sem APK — mostrando log:"
            tail -n 300 buildozer.log
            exit 1
          fi

      - name: ✅ Baixar APK
        uses: actions/upload-artifact@v4
        with:
          name: BotTradingPro-APK-FINAL
          path: bin/*.apk
