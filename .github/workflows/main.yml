name: Gerar APK BotTradingPro
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential git python3 python3-dev python3-pip \
            python3-venv openjdk-17-jdk wget unzip libffi-dev \
            libssl-dev libsqlite3-dev libncurses5-dev libtinfo5 cmake

      - name: Instalar Python e ferramentas
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install Cython==0.29.37 buildozer==1.5.0 sh==1.14.3

      - name: Limpar cache
        run: |
          rm -rf .buildozer bin buildozer.log
          source venv/bin/activate
          buildozer android clean || true

      - name: Compilar APK e MOSTRAR TUDO
        run: |
          source venv/bin/activate
          buildozer android debug
        timeout-minutes: 120

      - name: Verificar APK
        run: |
          ls -la bin/
          find . -name "*.apk" -type f

      - name: Baixar APK
        uses: actions/upload-artifact@v4
        with:
          name: BotTradingPro-APK-FINAL
          path: bin/*.apk
          if-no-files-found: error
