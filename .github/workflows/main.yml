name: Gerar APK BotTradingPro
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar libs do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libsqlite3-dev
          java -version
          python3 --version

      - name: Instalar Buildozer e Cython
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --no-cache-dir \
            Cython==0.29.37 \
            buildozer==1.5.0 \
            virtualenv==20.26.2
          buildozer --version

      - name: ACEITAR LICENÇAS GOOGLE + COMPILAR APK (15~20 min)
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses/ || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b940964dbf10b9bf471b6d16e09f7367441" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          yes | yes | buildozer android debug 2>&1 | tail -n 300
        timeout-minutes: 60

      - name: APK Pronto para baixar
        uses: actions/upload-artifact@v4
        with:
          name: BotTradingPro-APK-PRONTO
          path: bin/*.apk
          compression-level: 9
